<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type of List</title>
</head>
<body>
    <h1>Order list</h1>
    <ol>
        <li>Tea</li>
        <ul>
            <li>Milk</li>
            <li>Tea Leaf</li>
            <li>Sugar</li>
        </ul>
        <li>Coffee</li>
        <ul>
            <li>Milk</li>
            <li>Sugar</li>
            <li>Coffee</li>
        </ul>
        <li>Cold Coffee</li>
        <ul>
            <li>Milk</li>
            <li>Sugar</li>
            <li>Coffee</li>
            <li>Ice Cube</li>
        </ul>
    </ol>
    <h2>UnOrder list</h2>
    <ul>
        <li>Book</li>
        <li>Laptop</li>
        <ol>
            
            <li>Apple</li>
            <li>Banana</li>
            <li>Bread</li>
        </ol>
        <li>PC</li>
    </ul>
</body>
</html>
